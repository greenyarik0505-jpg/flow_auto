<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #0f172a;
    }
    p {
      font-size: 12px;
      margin: 0 0 10px 0;
      color: #64748b;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>🚀 Flow Auto Sync</h3>
  <p>При открытии Flow токен передается в <b>login.bat</b> автоматически!</p>
  <button id="copyBtn">📋 Скопировать и отправить токен</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
